[package]
name = "atha-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
boko = { version = "=0.5.0", default-features = false }
chardetng = "=1.0.0"
dom_query = "0.27"
encoding_rs = "=0.8.35"
fs2 = "=0.4.3"
imagesize = { version = "0.15", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
log = "0.4"
mdict-rs = { version = "=0.1.4", features = ["lzo"] }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
quick-xml = { version = "0.41", features = ["encoding"] }
regex = "=1.13.1"
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
png = "0.18.1"

[lints]
workspace = true
