[[permission]]
identifier = "allow-reader-event"
description = "允许主阅读窗口上报经过 Rust 严格校验的非内容事件。"
commands.allow = ["reader_event"]

[[permission]]
identifier = "allow-library-commands"
description = "允许资料库主窗口管理本地书架及完整本地数据生命周期。"
commands.allow = [
  "list_library_books",
  "import_library_books",
  "open_library_book",
  "remove_library_book",
  "delete_library_book_data",
  "pending_library_book_deletions",
  "finish_library_book_deletion",
  "backup_message_store",
  "restore_message_store",
  "backup_local_data",
  "prepare_local_data_restore",
  "commit_local_data_restore",
  "pending_local_data_restore",
  "finish_local_data_restore",
  "rollback_local_data_restore",
  "abort_local_data_restore",
  "local_data_storage_usage",
  "reading_memory_search",
  "reading_memory_source_captures",
  "reading_memory_snapshot_resource",
]

[[permission]]
identifier = "allow-dictionary-commands"
description = "允许主阅读窗口管理本地离线词典并查询当前选区。"
commands.allow = [
  "list_local_dictionaries",
  "import_local_dictionary",
  "lookup_local_dictionary",
  "remove_local_dictionary",
]

[[permission]]
identifier = "allow-message-commands"
description = "允许主阅读窗口管理当前书籍的标注、笔记和引用。"
commands.allow = [
  "message_roots",
  "message_edition_context",
  "message_conversation",
  "message_conversations",
  "message_create_root",
  "message_revise",
  "message_reply",
  "message_delete",
  "message_search",
  "message_relationships",
  "message_revisions",
  "message_source_captures",
  "message_snapshot_resource",
  "message_reselect",
  "message_reanchor",
  "message_import_legacy",
  "message_export",
]
